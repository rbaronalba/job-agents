version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule: {interval: monthly}
    open-pull-requests-limit: 3
    groups:
      python: {patterns: ["*"]}
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: monthly}
    groups:
      # CodeQL (init, analyze, upload-sarif) debe subir en las tres piezas a la vez
      acciones: {patterns: ["*"]}
